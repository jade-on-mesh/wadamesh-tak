name: fork-release

# Publishes this fork's firmware as a GitHub release, which is what a fork
# device's Settings > About checks and installs (see
# src/ui-touch/ForkUpdateCore.h). Versions follow upstream: the fork's builds on
# top of Wadamesh beta_93 are "wadamesh-tak beta_93.1", beta_93.2, ... tagged
# tak-beta_93.1, ... (upstream's version is the newest release-notes/beta_N.txt,
# which an upstream sync brings in). Runs for every change to main that touches
# the firmware, after an upstream sync, or by hand.
#
# Each board's app image is signed with the fork's release key (repo secret
# FORK_SIGNING_KEY, an Ed25519 seed in hex). The device refuses an image whose
# signature does not check out, so without the secret nothing is published.
#
# Upstream's release.yml (beta_* tags, wadamesh.com) is left alone and never
# runs here: this fork does not push beta_* tags.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "lib/**"
      - "variants/**"
      - "boards/**"
      - "platformio.ini"
      - "scripts/**"
      - "*.py"
      - "boards.json"
      - ".github/workflows/fork-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.n.outputs.tag }}
      skip: ${{ steps.n.outputs.skip }}
      fw: ${{ steps.boards.outputs.fw }}
      idf: ${{ steps.boards.outputs.idf }}
      notes: ${{ steps.boards.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next release number
        id: n
        env:
          HAS_KEY: ${{ secrets.FORK_SIGNING_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != true ]; then
            echo "::error::Repo secret FORK_SIGNING_KEY is not set, so no release can be signed."
            exit 1
          fi
          git fetch --quiet --tags origin
          if git tag --points-at HEAD | grep -q '^tak-beta_'; then
            echo "This commit is already released as $(git tag --points-at HEAD | grep '^tak-beta_' | head -1)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Upstream's version: the newest release-notes/beta_N.txt.
          base=$(ls release-notes | sed -n 's/^beta_\([0-9][0-9]*\)\.txt$/\1/p' | sort -n | tail -1)
          if [ -z "$base" ]; then
            echo "::error::No release-notes/beta_N.txt, so the upstream version is unknown."
            exit 1
          fi
          # The fork's next build on that base (none yet is fine: grep must not end the step).
          last=$(git tag -l "tak-beta_${base}.*" | sed "s/^tak-beta_${base}\.//" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
          tag="tak-beta_${base}.$(( ${last:-0} + 1 ))"
          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      # The boards come from boards.json (scripts/build/boards.py): a board added
      # there is built here, named in the notes and offered by the flasher.
      - name: Boards
        id: boards
        run: python3 scripts/build/boards.py matrix >> "$GITHUB_OUTPUT"

  firmware:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.fw) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build (release tag embedded; no Wi-Fi credentials baked in)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          unset WIFI_SSID WIFI_PWD
          BUILD_DATE="$(date -u '+%-d %b %Y')"   # e.g. "22 Oct 2026"; without it the About page shows upstream's date
          export PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_RELEASE_TAG='\"${TAG}\"' -DFIRMWARE_VERSION='\"wadamesh-tak ${TAG#tak-}\"' -DFIRMWARE_BUILD_DATE='\"${BUILD_DATE}\"'"
          pio run -e "${{ matrix.env }}"
          pio run -t mergebin -e "${{ matrix.env }}" || echo "::notice::no merged image for ${{ matrix.env }}"
          mkdir -p dist
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "dist/wadamesh-${{ matrix.board }}.bin"
          if [ -f ".pio/build/${{ matrix.env }}/firmware-merged.bin" ]; then
            cp ".pio/build/${{ matrix.env }}/firmware-merged.bin" "dist/wadamesh-${{ matrix.board }}-merged.bin"
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.board }}
          path: dist/*
      # The ELF, kept with the run (not the release) so a crash report's coredump
      # from this build can be decoded: espcoredump.py info_corefile -c <dump> <elf>.
      - uses: actions/upload-artifact@v4
        with:
          name: elf-${{ matrix.board }}
          path: .pio/build/${{ matrix.env }}/firmware.elf
          retention-days: 90
          if-no-files-found: ignore

  # The T-Display P4 images (boards.json entries with idf switches): an ESP-IDF build
  # (scripts/build/ci-p4.sh), one image per screen, radio and C6 firmware.
  p4:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.idf) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-LilyGo_TDeck_companion_radio_touch-${{ hashFiles('platformio.ini') }}
      - name: Libraries for the vendored components
        run: |
          pip install --upgrade platformio
          pio pkg install -e LilyGo_TDeck_companion_radio_touch
      - name: Build (espressif/idf:v5.5.1)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w espressif/idf:v5.5.1 \
            bash scripts/build/ci-p4.sh "$TAG" dist "${{ matrix.board }}" ${{ matrix.envs }}
          sudo chown -R "$(id -u)" dist
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.board }}
          path: dist/*

  publish:
    needs: [plan, firmware, p4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bins-*
          merge-multiple: true
      - name: Sign the app images
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          FORK_SIGNING_KEY: ${{ secrets.FORK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          pip install --quiet cryptography
          python3 - <<'PY'
          import glob, hashlib, os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.from_private_bytes(bytes.fromhex(os.environ["FORK_SIGNING_KEY"].strip()))
          tag = os.environ["TAG"]
          for path in sorted(glob.glob("dist/wadamesh-*.bin")):
              name = os.path.basename(path)
              if name.endswith("-merged.bin"):
                  continue   # USB images are flashed by hand, not installed by the device
              digest = hashlib.sha256(open(path, "rb").read()).digest()
              msg = b"wadamesh-fork-v1\n" + tag.encode() + b"\n" + name.encode() + b"\n" + digest
              open(path + ".sig", "wb").write(key.sign(msg))
              print("signed", name, digest.hex())
          PY
          ls -la dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          BOARDS: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          ver="${TAG#tak-}"   # beta_93.2
          notes="**Wadamesh-tak $ver**: fork build ${ver##*.} on top of Wadamesh ${ver%.*}, adding MeshCore Open TAK photos and voice, OTP Messenger and Team. Built from \`$GITHUB_SHA\`.

          Boards: ${BOARDS}. Easiest: the MediaMesh Flasher, https://cascadiamesh.org/mediamesh-flasher/. First USB install on any board: flash the \`-merged.bin\` at 0x0 (the plain \`.bin\` only suits a board already running this fork; several boards need this once for their bigger app slots, the P4 because its app starts at 0x20000). Identity, contacts and channels are kept; on-device settings and saved Wi-Fi reset. P4: the plain variant unless its C6 still runs the factory ESP-AT. If the screen stays black after flashing, unplug the board and plug it back in.

          Fork devices install this from **Settings > About > Install update**. To flash by USB, use a \`-merged.bin\`. Every app image carries a \`.sig\` that the device checks before installing."
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Wadamesh-tak $ver" \
            --notes "$(printf '%s' "$notes" | sed 's/^          //')" --latest
