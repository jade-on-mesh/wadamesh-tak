# Compile check for work branches: host tests plus a T-Deck firmware build.
# Releases still come from release.yml (beta_* tags).
name: build

on:
  push:
    branches-ignore: ['main']
  pull_request:
  workflow_dispatch:
  # Used by upstream-sync.yml to check a merged upstream release first.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Radio emulator (MediaMesh scan on modelled SX1262s)
        run: emu/build.sh
      - name: u-blox start-up aiding frames
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_ubx_assist test/test_ubx_assist.cpp
          /tmp/test_ubx_assist
      - name: VOX photo wire format
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_vox_wire test/test_vox_wire.cpp
          /tmp/test_vox_wire
      - name: New map points flash (MapHighlight.h)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_map_highlight test/test_map_highlight.cpp
          /tmp/test_map_highlight
      - name: Mesh photo fetch client (simulated mesh and Open TAK sender)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_vox_fetch test/test_vox_fetch.cpp src/ui-touch/VoxFetch.cpp
          /tmp/test_vox_fetch
      - name: Shared map pins (m:lat,lon|label|flags), as the app reads them
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_shared_pins test/test_shared_pins.cpp
          /tmp/test_shared_pins
      - name: Packed emoji unpack to their baked pixels
        run: |
          python3 scripts/build/pack-emoji.py
          git diff --exit-code src/ui-touch/emoji_data.c test/emoji_pack_expected.h
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I test/stub_lvgl -I src/ui-touch -I test \
              -o /tmp/test_emoji_pack test/test_emoji_pack.c src/ui-touch/emoji_data.c
          /tmp/test_emoji_pack
      - name: MediaMesh settings, CLI and scan timing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_mediamesh test/test_mediamesh_core.cpp
          /tmp/test_mediamesh
      - name: Quick replies (golden bytes and report hashes shared with Open TAK)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_quick_reply test/test_quick_reply.cpp
          /tmp/test_quick_reply
      - name: Predictive text (suggestions, learning, save/load)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_predict_text test/test_predict_text.cpp
          /tmp/test_predict_text
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_predict_file test/test_predict_file.cpp
          /tmp/test_predict_file dictionaries/words-en.pwd
      - name: Back-track (track thinning and following back)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_backtrack test/test_backtrack.cpp
          /tmp/test_backtrack
      - name: MediaMesh coverage margins (golden values shared with Open TAK)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_mediamesh_coverage test/test_mediamesh_coverage.cpp
          /tmp/test_mediamesh_coverage
      - name: VOX serving clips recorded on the radio (Open TAK's request bytes, simulated mesh)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_vox_serve test/test_vox_serve.cpp src/ui-touch/VoxServe.cpp
          /tmp/test_vox_serve
      - name: VOX voice decoder (Codec2, sample-exact against the app's build)
        run: test/build_vox_voice_test.sh /tmp/vox_voice
      - name: VOX voice recording (encoder bit-exact against the app's build, mic levelling)
        run: test/build_vox_record_test.sh /tmp/vox_record
      - name: Sound link (Wavest messages, share links, ggwave with the radios' settings)
        run: test/build_sound_link_test.sh /tmp/sound_link
      - name: VOX photo decoder (bit-exact against libaom, sanitizers on)
        run: test/build_vox_av1_test.sh /tmp/vox_av1
      - name: OTP Messenger against OTP_3_RC1.lua (both ways, on the firmware's Lua)
        run: test/build_otp_test.sh /tmp/otp
      - name: OTP pad check codes (same vectors as MeshCore Open TAK)
        run: |
          g++ -std=gnu++17 -Wall -Wextra -Werror -Wno-format-truncation -fsanitize=address,undefined -I src \
              test/test_otp_pad_check.cpp src/ui-touch/OtpCore.cpp -o /tmp/test_otp_pad_check
          /tmp/test_otp_pad_check
      - name: Fork firmware updates (signature check against the release key)
        run: |
          mkdir -p /tmp/ed && (cd /tmp/ed && gcc -c -O1 -I$GITHUB_WORKSPACE/lib/ed25519 $GITHUB_WORKSPACE/lib/ed25519/{verify,ge,fe,sc,sha512}.c)
          g++ -std=c++17 -Wall -I src -I test test/test_fork_update.cpp /tmp/ed/*.o -o /tmp/fork_update_test && /tmp/fork_update_test
      - name: Walkie-talkie wire golden bytes and jitter buffer (shared with Open TAK)
        run: g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src test/test_walkie.cpp -o /tmp/walkie_test && /tmp/walkie_test
      - name: LoRa Update serves a .mota from SD to a fetching OTA engine
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I test/ota_shim -I src
          test/test_lora_update.cpp src/helpers/ota/OtaManager.cpp src/helpers/ota/OtaProtocol.cpp
          src/helpers/ota/MotaContainer.cpp src/helpers/ota/MerkleTree.cpp -o /tmp/lora_update && /tmp/lora_update
      - name: Remote ID parser (GridDown's own tests, vendored)
        run: g++ -std=c++17 -w -I src test/test_remoteid.cpp src/ui-touch/remoteid.cpp -lm -o /tmp/test_remoteid && /tmp/test_remoteid
      - name: Drone Detector glue (Wi-Fi frames, BLE one message at a time, Watch posts)
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src test/test_drone_core.cpp
          src/ui-touch/remoteid.cpp -o /tmp/drone_core && /tmp/drone_core
      - name: 900 MHz drone scanner classifier (GridDown's, on simulated sweeps)
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src test/test_scan900.cpp
          src/ui-touch/Scan900.cpp -o /tmp/scan900 && /tmp/scan900
      - name: Team wire golden bytes and core rules (shared with Open TAK)
        run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I src test/test_team_wire.cpp src/ui-touch/TeamCore.cpp -o /tmp/team_test && /tmp/team_test
      - name: MeshCore TEAM interop (host test, golden strings shared with Open TAK)
        run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I src test/test_team_compat.cpp src/ui-touch/TeamCore.cpp -o /tmp/team_compat && /tmp/team_compat
      - name: One-scan team setup (host test, golden strings shared with Open TAK)
        run: g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src test/test_team_setup.cpp -o /tmp/team_setup && /tmp/team_setup
      - name: Watched channels on the map (host test)
        run: g++ -std=c++17 -Wall -I src test/test_watch_feed.cpp -o /tmp/watch_test && /tmp/watch_test
      - name: Flock You signatures, log, cameras, downloads and channel alerts (host test)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_flock_core test/test_flock_core.cpp
          /tmp/test_flock_core
          python3 test/test_flock_dl.py   # the radio's downloader and scripts/flock_cameras.py agree
      - name: Pad QR parts (shared with Open TAK; each part checked against LVGL's QR encoder)
        run: |
          g++ -std=c++17 -Wall -I src test/test_pad_qr.cpp -o /tmp/pad_qr_test && /tmp/pad_qr_test
          git clone -q --depth 1 -b v8.3.11 https://github.com/lvgl/lvgl.git /tmp/lvgl
          gcc -c -DLV_CONF_SKIP /tmp/lvgl/src/extra/libs/qrcode/qrcodegen.c -o /tmp/qrgen.o
          g++ -std=c++17 -Wall -I src -DQRGEN=/tmp/lvgl/src/extra/libs/qrcode test/test_pad_qr.cpp /tmp/qrgen.o -o /tmp/pad_qr_fit && /tmp/pad_qr_fit

  firmware:
    permissions:
      contents: write   # the internal-RAM report goes to the ram-report branch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [LilyGo_TDeck_companion_radio_touch, ThinkNode_M9_companion_radio_touch,
              tlora_pager_sx1262_companion_radio_touch, tlora_pager_lr1121_companion_radio_touch,
              heltec_v4_tft_companion_radio_usb_tcp_touch, heltec_v4_r8_tft_companion_radio_usb_tcp_touch,
              wio_tracker_l2_companion_radio_touch, crowpanel_35_companion_radio_touch,
              crowpanel_50_companion_radio_touch]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        shell: bash
        run: |
          unset WIFI_SSID WIFI_PWD
          set -o pipefail
          # A linker map, for the internal-RAM report below (changes nothing in the image).
          export PLATFORMIO_BUILD_FLAGS="-Wl,-Map,.pio/build/${{ matrix.env }}/firmware.map"
          pio run -e ${{ matrix.env }} 2>&1 | tee build.log
      - name: Compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          # (|| true: with no match, grep's status would end the step before the tail below)
          { grep -E "error:|Error|undefined reference|overflowed|greater than|too big" build.log || true; } | head -30 \
            | while IFS= read -r l; do echo "::error::${l}"; done
          tail -12 build.log | while IFS= read -r l; do echo "::error title=build log tail::${l}"; done
      - name: Where the flash goes (largest objects and symbols, when a build fails)
        if: failure()
        shell: bash
        env:
          B: .pio/build/${{ matrix.env }}
        run: |
          [ -f "$B/firmware.elf" ] || exit 0
          python3 - <<'PY'
          import glob, os, subprocess
          b = os.environ["B"]
          t = os.path.expanduser("~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-")
          objs = []
          for o in glob.glob(b + "/**/*.o", recursive=True):
              try:
                  out = subprocess.run([t + "size", o], capture_output=True, text=True).stdout.split("\n")[1].split()
                  objs.append((int(out[0]) + int(out[1]), o[len(b) + 1:]))
              except Exception:
                  pass
          objs.sort(reverse=True)
          print("::notice title=largest objects (text+data)::" + "%0A".join(f"{n} {o}" for n, o in objs[:45]))
          syms = []
          for l in subprocess.run([t + "nm", "-S", "--size-sort", "-C", b + "/firmware.elf"], capture_output=True, text=True).stdout.splitlines():
              f = l.split(" ", 3)
              if len(f) == 4 and f[2] in "tTrRdD":
                  syms.append((int(f[1], 16), f[3][:100]))
          syms.sort(reverse=True)
          print("::notice title=largest symbols::" + "%0A".join(f"{n} {s}" for n, s in syms[:45]))
          PY
      - name: Firmware size
        run: |
          ls -la .pio/build/${{ matrix.env }}/firmware.bin
          echo "### ${{ matrix.env }}" >> "$GITHUB_STEP_SUMMARY"
          echo "firmware.bin: $(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin) bytes" >> "$GITHUB_STEP_SUMMARY"
          ~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-size \
            .pio/build/${{ matrix.env }}/firmware.elf >> "$GITHUB_STEP_SUMMARY" || true
          ~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-size -t \
            .pio/build/${{ matrix.env }}/lib*/libdav1d.a 2>/dev/null | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          # Also as an annotation, so the numbers are readable from the checks API.
          BIN=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          DAV=$(~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-nm -S --size-sort \
                .pio/build/${{ matrix.env }}/firmware.elf | grep -ciE ' dav1d_' || true)
          echo "::notice title=${{ matrix.env }} size::firmware.bin ${BIN} bytes; dav1d symbols linked: ${DAV}"
      # Internal RAM (ESP32-S3: IRAM and DRAM share the same 512 KB SRAM; what the
      # image takes statically is gone from the heap Wi-Fi, BLE, TLS and task
      # stacks need). Totals and the largest internal-RAM symbols as annotations.
      - name: Internal RAM (static)
        shell: bash
        env:
          B: .pio/build/${{ matrix.env }}
        run: |
          [ -f "$B/firmware.elf" ] || exit 0
          python3 - <<'PY'
          import os, subprocess
          b = os.environ["B"]; env = b.split("/")[-1]
          t = os.path.expanduser("~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-")
          secs = {}
          for l in subprocess.run([t + "size", "-A", b + "/firmware.elf"], capture_output=True, text=True).stdout.splitlines():
              f = l.split()
              if len(f) >= 3 and f[0].startswith("."):
                  secs[f[0]] = (int(f[1]), int(f[2]))
          def tot(pred): return sum(sz for n, (sz, a) in secs.items() if pred(n, a))
          dram = tot(lambda n, a: 0x3FC88000 <= a < 0x3FD00000 and n != ".dram0.dummy")   # dummy: IRAM seen from DRAM
          iram = tot(lambda n, a: 0x40370000 <= a < 0x403E0000)
          psram = tot(lambda n, a: 0x3C000000 <= a < 0x3E000000 and "bss" in n)
          print(f"::notice title={env} internal RAM::DRAM static {dram} B, IRAM {iram} B, total {dram + iram} B; PSRAM bss {psram} B")
          syms = []
          for l in subprocess.run([t + "nm", "-S", "--size-sort", "-C", b + "/firmware.elf"], capture_output=True, text=True).stdout.splitlines():
              f = l.split(" ", 3)
              if len(f) != 4 or f[2] not in "bBdD": continue
              try: a = int(f[0], 16); n = int(f[1], 16)
              except ValueError: continue
              if 0x3FC88000 <= a < 0x3FD00000: syms.append((n, f[3][:90]))
          syms.sort(reverse=True)
          print(f"::notice title={env} largest internal RAM symbols::" + "%0A".join(f"{n} {s}" for n, s in syms[:60]))
          print(f"::notice title={env} internal RAM sections::" + "%0A".join(
              f"{n} {sz} @0x{a:x}" for n, (sz, a) in sorted(secs.items(), key=lambda x: -x[1][0])
              if (0x3FC88000 <= a < 0x3FD00000 or 0x40370000 <= a < 0x403E0000) and sz))
          # Who puts it there: input sections of the linker map in internal RAM, by
          # library (archive) and by object file.
          import re, collections
          mp = b + "/firmware.map"
          by_lib, by_obj = collections.Counter(), collections.Counter()
          print(f"::notice title={env} linker map::{'found' if os.path.exists(mp) else 'MISSING'} {mp}")
          if os.path.exists(mp):
              pend = None
              rx = re.compile(r"^\s*(\.\S+)?\s+0x([0-9a-f]+)\s+0x([0-9a-f]+)\s+(\S+)")
              for line in open(mp, errors="replace"):
                  m = rx.match(line)
                  if not m:
                      t = line.strip()
                      pend = t if t.startswith(".") and " " not in t else None
                      continue
                  a, n, src = int(m.group(2), 16), int(m.group(3), 16), m.group(4)
                  if not n or not (0x3FC88000 <= a < 0x3FD00000 or 0x40370000 <= a < 0x403E0000): continue
                  lib = src.split("(")[0].split("/")[-1]
                  obj = src.split("/")[-1]
                  by_lib[lib] += n; by_obj[obj[:80]] += n
              print(f"::notice title={env} internal RAM by library::" + "%0A".join(f"{n} {k}" for k, n in by_lib.most_common(40)))
          # Annotations are capped per job, so the whole report also goes to a branch.
          if True:
              with open("ram-report.txt", "w") as out:
                  out.write("sections\n" + "\n".join(f"{sz:8} {n} @0x{a:x}" for n, (sz, a) in sorted(secs.items(), key=lambda x: -x[1][0]) if sz) + "\n\n")
                  out.write("by library (internal RAM: DRAM + IRAM)\n" + "\n".join(f"{n:8} {k}" for k, n in by_lib.most_common(80)) + "\n\n")
                  out.write("by object\n" + "\n".join(f"{n:8} {k}" for k, n in by_obj.most_common(150)) + "\n\n")
                  out.write("symbols\n" + "\n".join(f"{n:8} {s}" for n, s in syms[:200]) + "\n")
          PY
          # Flash too (and the same internal-RAM view as the P4's), by symbol,
          # library and object: scripts/build/mem-report.py.
          if [ -f ram-report.txt ] && [ -f "$B/firmware.map" ]; then
            { echo; echo "===== mem-report.py ====="; python3 scripts/build/mem-report.py "$B/firmware.elf" "$B/firmware.map" \
                ~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-; } >> ram-report.txt || true
          fi
          if [ -f ram-report.txt ]; then
            d=$(mktemp -d); cp ram-report.txt "$d/${{ matrix.env }}.txt"; cd "$d"
            git init -q -b ram-report && git add -A
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "RAM report ${GITHUB_SHA::7} ${{ matrix.env }}"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "ram-report:ram-report/${{ matrix.env }}" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware*.bin
          if-no-files-found: warn

  # The T-Display P4 (AMOLED, SX1262, esp-hosted C6) is an ESP-IDF project, built in
  # Espressif's IDF image by scripts/build/ci-p4.sh. Its vendored libraries come from
  # the T-Deck env's PlatformIO libdeps.
  p4:
    permissions:
      contents: write   # the memory report goes to the ram-report/tdisplay-p4 branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-LilyGo_TDeck_companion_radio_touch-${{ hashFiles('platformio.ini') }}
      - name: Libraries for the vendored components
        run: |
          pip install --upgrade platformio
          pio pkg install -e LilyGo_TDeck_companion_radio_touch
      - name: Build (espressif/idf:v5.5.1)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/w" -w /w espressif/idf:v5.5.1 \
            bash scripts/build/ci-p4.sh dev-check dist tdisplay-p4 2>&1 | tee build.log
      - name: Errors as annotations
        if: failure()
        shell: bash
        run: |
          { grep -E "error:|undefined reference|FAILED|Error" build.log || true; } | head -30 | while IFS= read -r l; do echo "::error::${l}"; done
          echo "::error title=build log tail::$(tail -40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Size
        run: echo "::notice title=tdisplay-p4 size::application.bin $(stat -c %s dist/wadamesh-tdisplay-p4.bin) bytes (5.5 MB slot)"
      # Flash, internal RAM and PSRAM by section, symbol, library and object
      # (scripts/build/mem-report.py), on a branch: annotations are too small.
      - name: Memory report
        if: always()
        shell: bash
        run: |
          f=dist/mem-report-tdisplay-p4.txt
          [ -f "$f" ] || { echo "::warning::no memory report"; exit 0; }
          grep "^total " "$f" | while IFS= read -r l; do echo "::notice title=tdisplay-p4 memory::$l"; done
          d=$(mktemp -d); cp "$f" "$d/tdisplay-p4.txt"; cd "$d"
          git init -q -b ram-report && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Memory report ${GITHUB_SHA::7} tdisplay-p4"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "ram-report:ram-report/tdisplay-p4" || true
      # The OTA image and the merged one for a USB flash, like the other boards'.
      - uses: actions/upload-artifact@v4
        with:
          name: tdisplay-p4
          path: dist/wadamesh-tdisplay-p4*.bin
          if-no-files-found: warn

