name: flasher-pages

# Publishes the MediaMesh Flasher (flasher/index.html) to GitHub Pages together
# with copies of the newest Wadamesh TAK USB images (releases.json), every
# Spectra-Cascadia DX-LR30 image (spectra-releases.json; they are tiny) and the
# Keymind Cascade companion and repeater USB images named in Keymind's Mesh
# America catalog: ESP32 merged images and nRF52 serial DFU packages
# (keymind-mirror.json).
#
# Why a copy: GitHub's release downloads (github.com/.../releases/download/...)
# send no CORS headers, so a web page can't fetch them. GitHub Pages serves
# everything with `Access-Control-Allow-Origin: *`, so the flasher works from
# Pages itself and from any other site that embeds or copies it.
#
# The site is pushed to the gh-pages branch (one commit, replaced each run, so the
# firmware copies don't pile up in history). Pages serves it at
# https://jade-on-mesh.github.io/wadamesh-tak/ (Settings > Pages: branch gh-pages, / (root)).
#
# Stays in sync with all three firmwares:
# - Wadamesh TAK: right after every successful fork-release (a release created
#   with GITHUB_TOKEN fires no `release` event, hence workflow_run).
# - Spectra-Cascadia and Keymind Cascade live in other repos, so every 30 minutes
#   a quick check compares their newest releases (and Keymind's catalog) with what
#   was last published, and republishes only when something changed.
# - Also on changes to the flasher itself, and by hand (Actions > flasher-pages >
#   Run workflow), which always republishes.

on:
  workflow_run:
    workflows: [fork-release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "flasher/**"
      - "boards.json"
      - ".github/workflows/flasher-pages.yml"
  schedule:
    - cron: "7,37 * * * *"   # every 30 min: a cheap check, publishes only when something changed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flasher-pages
  cancel-in-progress: false   # never cut off a publish that is already running

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      KEEP: "6"   # how many of the newest releases get their bins mirrored
    steps:
      - uses: actions/checkout@v4

      - name: Anything new since the last publish?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CATALOG: https://raw.githubusercontent.com/mikecarper/MeshCore/keymindCascade/mesh-america/keymind-cascade-v1.16.0-provider.json
        run: |
          set -euo pipefail
          {
            gh api "repos/$REPO/releases?per_page=20" --jq '.[] | select(.tag_name | startswith("tak-beta_")) | .tag_name'
            gh api "repos/jade-on-mesh/spectra-cascadia/releases?per_page=30" --jq '.[] | .tag_name + " " + ([.assets[].name] | sort | join(","))'
            curl -sSfL --retry 3 "$CATALOG" | sha256sum
            sha256sum flasher/index.html boards.json .github/workflows/flasher-pages.yml
          } > fingerprint.txt
          fp=$(sha256sum fingerprint.txt | cut -c1-64)
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          last=""
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then last=$(git show FETCH_HEAD:sync-state.txt 2>/dev/null || true); fi
          if [ "$EVENT" = "schedule" ] && [ "$fp" = "$last" ]; then
            echo "Nothing new; the published flasher is current."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing ($EVENT)."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror the newest releases' USB images
        if: steps.check.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          cp flasher/index.html site/index.html
          python3 scripts/build/boards.py flasher site/index.html   # the list from boards.json, even if the copy in flasher/ lags
          touch site/.nojekyll
          gh api "repos/$REPO/releases?per_page=60" > releases-all.json
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          repo, keep = os.environ["REPO"], int(os.environ["KEEP"])
          rels = [r for r in json.load(open("releases-all.json"))
                  if r["tag_name"].startswith("tak-beta_") and not r["draft"]]
          rels.sort(key=lambda r: r["published_at"], reverse=True)
          out = []
          for i, r in enumerate(rels):
              tag, mirrored = r["tag_name"], i < keep
              assets = [a for a in r["assets"] if a["name"].endswith("-merged.bin")]
              if mirrored and assets:
                  d = f"site/firmware/{tag}"
                  os.makedirs(d, exist_ok=True)
                  subprocess.run(["gh", "release", "download", tag, "-R", repo,
                                  "-p", "*-merged.bin", "-D", d], check=True)
              entry = {k: r.get(k) for k in ("tag_name", "name", "published_at", "prerelease", "html_url", "body")}
              entry["mirrored"] = mirrored and bool(assets)
              entry["assets"] = []
              for a in assets:
                  digest = a.get("digest")
                  path = f"site/firmware/{tag}/{a['name']}"
                  if entry["mirrored"] and os.path.exists(path):
                      sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
                      if digest and digest != "sha256:" + sha:
                          raise SystemExit(f"{tag}/{a['name']}: download does not match GitHub's digest")
                      digest = "sha256:" + sha
                  entry["assets"].append({"name": a["name"], "size": a["size"], "digest": digest,
                                          "browser_download_url": a["browser_download_url"]})
              out.append(entry)
          json.dump(out, open("site/releases.json", "w"), indent=1)
          print(f"{len(out)} releases listed, {sum(e['mirrored'] for e in out)} mirrored")
          PY

      - name: Mirror Spectra-Cascadia (DX-LR30) releases
        if: steps.check.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPECTRA: jade-on-mesh/spectra-cascadia
        run: |
          set -euo pipefail
          gh api "repos/$SPECTRA/releases?per_page=30" > spectra-all.json
          python3 - <<'PY2'
          import hashlib, json, os, subprocess
          repo = os.environ["SPECTRA"]
          out = []
          for r in json.load(open("spectra-all.json")):
              assets = [a for a in r["assets"] if a["name"].startswith("spectra-cascadia-") and a["name"].endswith((".bin", ".hex"))]
              if r["draft"] or not assets:
                  continue
              d = f"site/spectra/{r['tag_name']}"
              os.makedirs(d, exist_ok=True)
              subprocess.run(["gh", "release", "download", r["tag_name"], "-R", repo, "-p", "spectra-cascadia-*", "-D", d], check=True)
              entry = {k: r.get(k) for k in ("tag_name", "name", "published_at", "prerelease", "html_url", "body")}
              entry["mirrored"] = True
              entry["assets"] = []
              for a in assets:
                  sha = "sha256:" + hashlib.sha256(open(f"{d}/{a['name']}", "rb").read()).hexdigest()
                  if a.get("digest") and a["digest"] != sha:
                      raise SystemExit(f"{r['tag_name']}/{a['name']}: download does not match GitHub's digest")
                  entry["assets"].append({"name": a["name"], "size": a["size"], "digest": sha,
                                          "browser_download_url": a["browser_download_url"]})
              out.append(entry)
          out.sort(key=lambda e: e["published_at"], reverse=True)
          json.dump(out, open("site/spectra-releases.json", "w"), indent=1)
          print(f"{len(out)} Spectra-Cascadia releases mirrored")
          PY2
          du -sh site

      - name: Mirror Keymind Cascade companion and repeater USB images (ESP32 + nRF52)
        if: steps.check.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEYMIND: mikecarper/MeshCore
          CATALOG: https://raw.githubusercontent.com/mikecarper/MeshCore/keymindCascade/mesh-america/keymind-cascade-v1.16.0-provider.json
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 "$CATALOG" -o keymind-catalog.json
          python3 - <<'PY3'
          import concurrent.futures as cf, hashlib, json, os, subprocess, urllib.parse
          repo = os.environ["KEYMIND"]
          prefix = f"https://github.com/{repo}/releases/download/"
          want = {}
          for d in json.load(open("keymind-catalog.json"))["device"]:
              # ESP32: the merged USB image; nRF52: the serial DFU package (.zip)
              kind = {"esp32": "flash-wipe", "nrf52": "flash"}.get(d.get("type"))
              if not kind:
                  continue
              for fw in d["firmware"]:
                  if not (fw["role"].startswith("companion") or fw["role"] == "repeater"):
                      continue
                  for v in fw["version"].values():
                      for f in v["files"]:
                          if f["type"] == kind and f["url"].startswith(prefix) and (kind != "flash" or f["name"].endswith(".zip")):
                              want[f["url"]] = "keymind/" + urllib.parse.unquote(f["url"][len(prefix):])
          # GitHub's own checksums for every asset on the release pages involved.
          digests = {}
          for tag in sorted({p.split("/")[1] for p in want.values()}):
              rid = subprocess.run(["gh", "api", f"repos/{repo}/releases/tags/{tag}", "--jq", ".id"],
                                   check=True, capture_output=True, text=True).stdout.strip()
              pages = subprocess.run(["gh", "api", "--paginate", f"repos/{repo}/releases/{rid}/assets?per_page=100",
                                      "--jq", ".[] | [.name, (.digest // \"\")] | @tsv"],
                                     check=True, capture_output=True, text=True).stdout
              for line in pages.splitlines():
                  name, dg = (line.split("\t") + [""])[:2]
                  digests[f"{tag}/{name}"] = dg
          def fetch(item):
              url, path = item
              dst = "site/" + path
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              subprocess.run(["curl", "-sSfL", "--retry", "3", "-o", dst, url], check=True)
              sha = "sha256:" + hashlib.sha256(open(dst, "rb").read()).hexdigest()
              gh = digests.get(path[len("keymind/"):], "")
              if gh and gh != sha:
                  raise SystemExit(f"{path}: download does not match GitHub's digest")
              return url, {"path": path, "size": os.path.getsize(dst), "digest": sha}
          with cf.ThreadPoolExecutor(8) as pool:
              out = dict(pool.map(fetch, sorted(want.items())))
          json.dump(out, open("site/keymind-mirror.json", "w"), indent=1)
          print(f"{len(out)} Keymind Cascade images mirrored")
          PY3
          du -sh site site/keymind

      - name: Record what was published
        if: steps.check.outputs.go == 'true'
        run: echo "${{ steps.check.outputs.fp }}" > site/sync-state.txt

      - name: Publish to the gh-pages branch
        if: steps.check.outputs.go == 'true'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "MediaMesh Flasher site"
