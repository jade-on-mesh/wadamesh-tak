; ESP-IDF 5 spike (IDF5_MIGRATION.md, phase 1). Not a release build.
;
; Builds the T-Deck on pioarduino (Arduino core 3.3.11, ESP-IDF 5.5.5) to see what
; breaks and what it costs in flash and internal RAM. Kept out of platformio.ini so
; upstream syncs never touch it:
;   pio run -c platformio_idf5.ini -e LilyGo_TDeck_idf5
[platformio]
extra_configs = platformio.ini

[env:LilyGo_TDeck_idf5]
extends = env:LilyGo_TDeck_companion_radio_touch
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; Report every compile error in one run, not just the first.
extra_scripts =
  ${env:LilyGo_TDeck_companion_radio_touch.extra_scripts}
  pre:scripts/build/keep_going.py
  pre:scripts/build/idf5_core_compat.py
; Adafruit seesaw (via the ST7789 library) asks for a library named "SD". On 6.11 the
; framework's SD answered it; here the registry's Arduino AVR one was installed and
; won (#error Architecture or board not supported). Name the framework's copy.
lib_deps =
  ${env:LilyGo_TDeck_companion_radio_touch.lib_deps}
  SD=symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD
; GCC 14 makes a missing return an error; the pinned core's RAK12035 sensor driver
; has one (not used on the T-Deck). Kept a warning, as on 6.11's GCC 8.
build_flags =
  ${env:LilyGo_TDeck_companion_radio_touch.build_flags}
  -Wno-error=return-type
  ; The core lib's build_as_lib.py adds helpers/esp32 (SerialBLEInterface and the rest)
  ; when CPPDEFINES holds a bare "ESP32", which platform 6.11 passes and pioarduino
  ; doesn't: without it the BLE companion interface never linked.
  -D ESP32
; pioarduino links every library object straight in unless this is set; platform 6.11
; archives them, so the linker only pulls what is used. Without it LVGL's own
; Montserrat 14 clashes with ours (ui_font_14.c), and unused objects cost flash.
lib_archive = yes

; The same build with framework code moved out of internal RAM (IDF5_MIGRATION.md,
; phase 3). custom_sdkconfig makes pioarduino rebuild the Arduino libraries with these
; settings (slower). On the S3, IRAM and DRAM share one internal SRAM: every byte of
; code that leaves IRAM is heap.
[env:LilyGo_TDeck_idf5_tuned]
extends = env:LilyGo_TDeck_idf5
custom_sdkconfig =
  CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH=y
  CONFIG_RINGBUF_PLACE_FUNCTIONS_INTO_FLASH=y
  CONFIG_HEAP_PLACE_FUNCTION_INTO_FLASH=y
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_EXTRA_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_LWIP_IRAM_OPTIMIZATION=n
  CONFIG_LWIP_EXTRA_IRAM_OPTIMIZATION=n
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y
  CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM=y
  CONFIG_LOG_MAXIMUM_EQUALS_DEFAULT=y
